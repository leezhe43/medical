<!DOCTYPE html>

<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>預約管理</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<div class="container py-5">

    <h1 class="mb-4">
        全家健康管理中心－預約管理
    </h1>


    {% if bookings %}

    <div class="table-responsive">

        <table class="table table-bordered table-striped bg-white">

            <thead class="table-primary">

                <tr>

                    <th>
                        編號
                    </th>

                    <th>
                        姓名
                    </th>

                    <th>
                        電話
                    </th>

                    <th>
                        Email
                    </th>

                    <th>
                        預約日期
                    </th>

                    <th>
                        需求
                    </th>

                    <th>
                        操作
                    </th>

                </tr>

            </thead>


            <tbody>

                {% for booking in bookings %}

                <tr>

                    <td>
                        {{ booking["id"] }}
                    </td>

                    <td>
                        {{ booking["name"] }}
                    </td>

                    <td>
                        {{ booking["phone"] }}
                    </td>

                    <td>
                        {{ booking["email"] }}
                    </td>

                    <td>
                        {{ booking["booking_date"] }}
                    </td>

                    <td>
                        {{ booking["message"] }}
                    </td>

                    <td>

                        <form
                            method="POST"
                            action="{{ url_for(
                                'delete_booking',
                                booking_id=booking['id']
                            ) }}">

                            <button
                                type="submit"
                                class="btn btn-danger btn-sm"
                                onclick="return confirm('確定要刪除嗎？');">

                                刪除

                            </button>

                        </form>

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

    {% else %}

        <div class="alert alert-info">

            目前沒有預約資料。

        </div>

    {% endif %}


    <a
        href="{{ url_for('home') }}"
        class="btn btn-primary">

        返回網站

    </a>

</div>


</body>

</html>
